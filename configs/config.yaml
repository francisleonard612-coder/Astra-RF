# Astra configuration
# Values here are defaults; most can be overridden via environment variables
# (see app/config.py for the mapping). Edit freely per-deployment.

symbols:
  # Astra discovers symbols dynamically from Deriv's active_symbols call.
  # ASTRA_SYMBOLS (see .env.example) currently pins trading to 1HZ10V and
  # 1HZ100V specifically -- clear that env var to fall back to trading
  # every synthetic index whose underlying symbol starts with one of these
  # prefixes, so adding more symbols later is a config change, not a code
  # change.
  prefixes: ["R_", "1HZ"]
  refresh_seconds: 3600

contracts:
  duration: 1
  duration_unit: "t"          # ticks -- LEGACY, digit-only; unused since the Rise/Fall pivot
  over_barrier: 2             # LEGACY, digit-only
  under_barrier: 7            # LEGACY, digit-only

  # Rise/Fall candidate durations for the Monte Carlo duration selector
  # (pricing/monte_carlo_duration.py) to rank, spanning both ticks and
  # minutes -- wired in via decision/rise_fall_decision_engine.py.
  # app/main.py now cross-checks this static grid against a live
  # `contracts_for` response per symbol before trading with it (see
  # pricing/duration_grid.py's filter_to_allowed()), so a value here that's
  # invalid for a given symbol/contract_type gets dropped rather than
  # spamming "Proposal request failed" on every tick. Even so, keep these
  # defaults realistic: confirmed in production that Deriv rejects CALL/PUT
  # tick-duration contracts outside 1-10 ticks ("Number of ticks must be
  # between 1 and 10") -- the previous defaults included 15/20/30, which
  # are minute-scale values that were never valid as tick counts and were
  # rejected on every single evaluation for every symbol.
  rise_fall:
    candidate_tick_durations: [3, 5, 7, 10]
    candidate_minute_durations: [1, 2, 3, 5, 10]

# Rise/Fall trade sizing and gating (decision/rise_fall_decision_engine.py).
# base_stake here is READ DIRECTLY as the flat per-trade stake -- see that
# module's own "STAKE SIZING WARNING" docstring for why this must stay a
# fixed value, never balance * percentage (a documented real incident in
# the ported source material: a balance-scaled stake and the risk
# allocator's independent sizing disagreed by 527x, caught only by a hard
# ceiling).
rise_fall:
  base_stake: 0.35
  min_edge: 0.11
  min_calibration_samples: 500
  mc_simulations: 50000
  # See decision/rise_fall_decision_engine.py's "MULTIPLE-COMPARISONS
  # WARNING": evaluate() checks 4 candidates per cycle and takes the best
  # edge, which measurably inflates the false-positive rate above what
  # min_edge alone implies for a single comparison (measured: ~50% of pure-
  # noise histories with fairly-priced quotes still produced a "trade" at
  # min_edge=0.03). Re-measure against real return data, and consider
  # raising min_edge and/or min_calibration_samples, before trusting these
  # defaults in production.

  # CONFIDENCE GATE: a candidate only clears this stage if BOTH its raw MC
  # win-probability (mc_win_probability) AND its calibrated probability
  # independently exceed min_confidence -- on top of, not instead of,
  # min_edge above. See decision/rise_fall_decision_engine.py's "CONFIDENCE
  # GATE" docstring for why both are required.
  min_confidence: 0.8

  # CALIBRATION-QUALITY GATE: found from a live deployment log where every
  # "Executing trade" line showed mc_win_probability == calibrated_
  # probability bit for bit -- calibration hadn't collected enough samples
  # to ever fit, so min_confidence above was comparing the same number to
  # itself twice. Once a candidate's calibrator HAS fit (is_calibrated=
  # True), this additionally requires its quality_score() (models/
  # calibration.py's ECE-based 0..1 reliability score) to clear this value
  # -- never enforced before a calibrator has fit, so it doesn't block
  # trading during a fresh symbol's cold start. 0.0 disables this gate (the
  # default) -- once tick_summary's calibration diagnostics show real
  # quality scores for a symbol, a sensible non-zero value to try is ~0.5.
  # See decision/rise_fall_decision_engine.py's "CALIBRATION-QUALITY GATE".
  min_calibration_quality: 0.0

  # PROBE TRADES: fixes a lockout min_calibration_quality above would
  # otherwise create -- a candidate blocked by the quality gate never gets
  # a real quote, never settles, and therefore never gets a fresh sample
  # to improve its quality_score(), which without this would be a
  # PERMANENT lock (fixable only from outside, e.g. a calibration
  # warm-start/Supabase restore overwriting its buffer). Once a
  # (contract_type, resolution) candidate has been blocked this many
  # consecutive cycles, the next one is let through past the quality gate
  # ONLY -- min_edge and min_confidence above still apply in full, so a
  # probe still has to look genuinely tradeable by every other measure.
  # Its stake is also forced to base_stake regardless of martingale
  # escalation. 0 disables probing entirely (the original permanent-
  # lockout behavior). See decision/rise_fall_decision_engine.py's
  # "PROBE TRADES" docstring.
  calibration_quality_probe_interval: 50

  # CALIBRATION WARM-START: if set, app/main.py loads
  # {this_dir}/{symbol}.json at startup (produced by
  # `python -m backtest.warm_start_calibration --symbols ...`) and replays
  # its (raw_prob, outcome) pairs into the matching per-(contract_type,
  # resolution) CalibrationTracker before the live loop starts, instead of
  # every calibrator beginning cold. null (the default) skips this
  # entirely -- see decision/rise_fall_decision_engine.py's "CALIBRATION
  # WARM-START" and research/calibration_warmstart.py.
  calibration_warm_start_dir: null

  # AUTO-GENERATE (opt-in, off by default): if true, and a symbol has NO
  # restorable calibration state in Supabase or the warm-start file above,
  # app/main.py automatically runs the same historical-tick replay
  # (research/calibration_warmstart.py's build_calibration_samples())
  # using the SAME history batch already fetched to seed PriceSeries at
  # startup -- no separate CLI run needed, and the bot begins trading
  # already at a warm calibration state rather than warming up gradually
  # via live trades. Saved to Supabase immediately afterward, so this is a
  # ONE-TIME cost per symbol -- every later restart just loads the saved
  # result (near-instant) instead of re-running the replay. This IS
  # CPU-bound and IS run off the event loop thread (see app/main.py's
  # asyncio.to_thread usage), but still adds real wall-clock time to
  # startup -- expect anywhere from single-digit seconds to a couple of
  # minutes depending on the settings below and how many symbols need it
  # simultaneously.
  calibration_warm_start_auto_generate: false
  # Historical ticks fetched per symbol when auto-generate triggers --
  # replaces the smaller default PriceSeries-only seed count so there's
  # enough history for a meaningful minute-resolution replay too.
  calibration_warm_start_auto_generate_count: 5000
  # MC simulations per candidate during the replay -- deliberately lower
  # than live mc_simulations above; see backtest/warm_start_calibration.py.
  calibration_warm_start_auto_generate_n_sims: 2000
  # Cost control -- only replay every Nth valid tick position, not every
  # one. See research/calibration_warmstart.py's build_calibration_samples()
  # docstring.
  calibration_warm_start_auto_generate_sample_every: 5

  # Martingale staking for Rise/Fall, routed through risk/staking.py's
  # StakingEngine (self.staking on RiseFallSymbolPipeline). OFF by default,
  # deliberately, same reasoning as risk.staking below: a sibling bot ran
  # martingale live for 278 trades and lost more from it than flat staking
  # would have, because the top stake tier had no better win rate than the
  # base tier -- progression amplifies losses when the underlying edge
  # doesn't hold, it doesn't create edge. Turning this on is a deliberate
  # choice to re-test that, not a recommended default. Whatever it computes
  # is still bounded by risk.max_stake below, which app/main.py checks
  # against the actual decision.stake for every trade.
  staking:
    enabled: true
    # Whether martingale progression (step, consecutive_losses) survives a
    # Railway restart/redeploy, via astra_rise_fall_staking_state in
    # Supabase. Deliberately OFF even when staking.enabled is true: a
    # restart currently resets an escalated stake back to base_stake,
    # which can be read either as lost progression (a reason to persist)
    # or as an accidental safety net against an escalated stake surviving
    # an unplanned restart (a reason not to). Calibration state (below,
    # under min_calibration_quality) has no such tradeoff and is always
    # persisted regardless of this flag.
    persist_across_restarts: false
    progression_factor: 2.0   # classic martingale: double the stake after each loss
    min_consecutive_losses: 2  # progression only ENGAGES after this many consecutive
                                # losses -- one isolated loss alone leaves stake at
                                # base_stake; the second consecutive loss is what first
                                # escalates it. Set to 1 to escalate after every loss.
    max_steps: 5               # resets to base_stake after this many consecutive escalations
    max_stake: 5.0              # hard ceiling on the progression itself, independent of risk.max_stake

  # Multi-layer conviction voting (decision/regime_conviction.py, wired in
  # via decision/rise_fall_decision_engine.py's "MULTI-LAYER VOTING"), using
  # four independent signal layers (models/tick_markov.py, ou_zscore.py,
  # hawkes_momentum.py, kalman_trend.py). RF_REGIME_LAYERS (that module) is
  # labeled "a STARTING HYPOTHESIS, not a validated mapping" in its own
  # docstring. conviction_shadow_only=true (the default): conviction is
  # computed and persisted on every trade (see astra_trades.conviction/
  # conviction_direction/layer_votes in database/schema.sql) but never
  # gates direction or sizes stake -- current MC/calibration/edge behavior
  # is completely unchanged. Currently running an overnight shadow
  # observation period specifically to build up enough completed trades for
  # decision/regime_conviction.py's conviction_outcome_report() to say
  # whether higher conviction actually correlates with a higher win rate
  # before this is ever allowed to touch a real trade. Do not flip to false
  # until that report has been run and shows a real, non-flat, non-inverted
  # relationship -- see that function's own docstring for how to read it.
  conviction_shadow_only: true
  conviction_min_voters: 4     # minimum NON-ABSTAINING layers required for a regime's mapped set to
                                 # count as a consensus at all -- see compute_conviction()'s own docstring
  conviction_floor: 0.25        # below this, conviction_stake() returns 0 (skip, not "trade small")
  conviction_min_mult: 0.5      # stake multiplier at conviction == conviction_floor
  conviction_max_mult: 3.0      # stake multiplier at conviction == 1.0
  conviction_max_stake: 0.0     # absolute cap on conviction-scaled stake; 0 = uncapped (still bounded
                                  # by risk.max_stake, checked against the actual decision.stake below)


feature_windows: [20, 50, 100, 250, 500, 1000, 2500]
max_markov_order: 3
min_samples_per_symbol: 900      # minimum digits observed before Astra will predict at all

risk:
  base_stake: 0.35
  max_stake: 1.2
  max_consecutive_losses: 5
  max_daily_loss: 25.0
  max_drawdown: 40.0
  max_trades_per_day: 5000
  max_concurrent_trades: 2         # hard cap on simultaneously OPEN (unsettled) contracts, across all symbols
  cooldown_seconds_after_max_losses: 900
  staking:
    enabled: false                 # LEGACY, digit-only (risk/staking.py) -- Rise/Fall uses rise_fall.base_stake
                                    # directly as a flat stake instead, see that section's own comment for why
    progression_factor: 1.18
    max_steps: 4

database:
  supabase_enabled: true
  persist_ticks: true
  tick_retention_hours: 48        # older raw ticks get pruned; rolling stats persist independently

logging:
  level: "INFO"

# --- Everything below this line is LEGACY: read only by the digit-trading
# code (decision/decision_engine.py, learning/architecture_competition.py,
# models/digit_specialist.py, learning/champion_challenger.py, etc.), which
# app/main.py no longer imports or runs since the Rise/Fall pivot. Left in
# place rather than deleted in case any of it is revisited later, but none
# of it affects a live run today.

ensemble:
  # starting weights; the ensemble learns/updates these online per symbol
  # from rolling log-loss performance (see learning/online.py)
  initial_weights:
    uniform: 0.05
    rolling_frequency: 0.15
    ewma_frequency: 0.10
    bayesian: 0.15
    markov: 0.20
    logistic: 0.10
    random_forest: 0.10
    xgboost: 0.15
  min_weight: 0.02
  performance_window: 500       # observations used for rolling log-loss weighting

calibration:
  method: "isotonic"           # isotonic | platt | none
  min_samples_to_calibrate: 200
  refit_every: 100

regime:
  entropy_high: 0.985           # normalized entropy above this -> HIGH_ENTROPY
  entropy_low: 0.90             # normalized entropy below this -> LOW_ENTROPY / CONCENTRATED
  chi_square_p_shift: 0.01      # p-value below this on recent-vs-baseline chi-square -> DISTRIBUTION_SHIFT
  model_agreement_unstable: 0.12  # stdev of per-model P(target) above this -> MODEL_DISAGREEMENT
  min_window_for_regime: 200

mispricing:
  minimum_edge: 0.03
  minimum_probability: 0.55
  minimum_calibration_score: 0.6
  minimum_model_agreement: 0.6      # 1 - normalized stdev; higher = more agreement
  minimum_sample_size: 300
  minimum_quality_score: 65
  allow_low_confidence_regimes: false

retraining:
  batch_model_every_n_observations: 300   # random_forest / xgboost refit cadence per symbol
  min_observations_for_batch_models: 500

champion_challenger:
  evaluate_every_n_trades: 40
  min_trades_to_evaluate: 40
  min_improvement: 0.01          # required rolling log-loss improvement to promote
  min_ev_no_worse_than: -0.0     # challenger EV must not be materially worse

architecture_competition:
  # How often (in scored ticks, per symbol) to re-evaluate which of the
  # three architectures (global | specialist | hybrid) should be champion.
  evaluate_every_n_ticks: 200
  min_samples_for_evaluation: 200   # each architecture needs at least this many scored ticks before it's eligible to be compared
  min_promotion_margin: 0.03        # composite score margin required to switch champion (avoids flapping on noise)
  # Weights for the 7-metric composite score. Each metric is min-max
  # normalized across the 3 architectures (direction-corrected so higher is
  # always better after normalization) before these weights are applied.
  composite_weights:
    log_loss: 0.20
    brier: 0.15
    calibration: 0.20
    stability: 0.05
    agreement: 0.10
    economic_ev: 0.15
    realized_pnl: 0.15
